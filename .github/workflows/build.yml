name: Build ReProvision-Reborn

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      WORKSPACE: ReProvision.xcworkspace
      SCHEME: iOS        # change after checking the "List schemes" step output
      CONFIGURATION: Release

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Install CocoaPods
        run: |
          gem install cocoapods --no-document || true
          pod --version

      - name: Install iOSOpenDev
        run: |
          git clone https://github.com/Matchstic/iOSOpenDev.git "$RUNNER_TEMP/iOSOpenDev"
          cd "$RUNNER_TEMP/iOSOpenDev"
          ls -la
          # Run the repo's installer script here once you confirm its name:
          sudo ./install.sh

      - name: Cache Pods
        uses: actions/cache@v4
        with:
          path: Pods
          key: pods-${{ runner.os }}-${{ hashFiles('Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: pod install
        run: pod install

      - name: List schemes
        run: xcodebuild -list -workspace "$WORKSPACE"

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build.log

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" | head -n 1)
          echo "Found app: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r ReProvision-unsigned.ipa Payload

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReProvision-unsigned
          path: |
            ReProvision-unsigned.ipa
            build.log
